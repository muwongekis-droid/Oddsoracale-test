<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betting Calendar</title>
<style>
:root {
  --bg:#b0b8c1; --panel:#d8dfe6; --card:#e2e8ee; --line:#a0aab4;
  --text:#1a1f26; --muted:#5a6472;
  --green:#1a7a40; --green-bg:#c8f0d8; --green-border:#2ecc71;
  --red:#b52a1c; --red-bg:#fad4cf; --red-border:#e74c3c;
  --accent:#c07820; --accent-bg:#fdf0d8; --accent-border:#e6a030;
  --blue:#1a5fa8; --blue-bg:#d0e4f7; --blue-border:#3498db;
  --purple:#6a1a8a; --purple-bg:#ead0f7; --purple-border:#9b59b6;
  --teal:#0e7a6e; --teal-bg:#c8f0ec; --teal-border:#1abc9c;
  --rose:#8a1a3a; --rose-bg:#f7d0dc; --rose-border:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow-x:hidden;}
.page{max-width:480px;margin:0 auto;padding:10px;}

.app-header{background:var(--panel);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;border:1px solid var(--line);}
.app-title{font-size:1rem;font-weight:700;}
.app-sub{font-size:0.65rem;color:var(--muted);margin-top:1px;}
.month-nav{display:flex;align-items:center;gap:8px;}
.nav-btn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;width:30px;height:30px;font-size:1rem;font-weight:700;cursor:pointer;}
.month-label{font-weight:700;font-size:0.85rem;min-width:110px;text-align:center;}

/* BACKUP/EXPORT BAR */
.action-bar{display:flex;gap:6px;margin-bottom:10px;}
.action-btn{flex:1;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-size:0.72rem;font-weight:700;cursor:pointer;text-align:center;}
.action-btn.backup{border-color:var(--blue-border);color:var(--blue);background:var(--blue-bg);}
.action-btn.export{border-color:var(--green-border);color:var(--green);background:var(--green-bg);}
.action-btn.restore{border-color:var(--accent-border);color:var(--accent);background:var(--accent-bg);}

/* CAL TABS — scrollable row */
.cal-tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;}
.cal-tab{flex-shrink:0;min-width:68px;padding:8px 4px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--muted);font-size:0.62rem;font-weight:700;cursor:pointer;text-align:center;line-height:1.35;}
.cal-tab.active.c0{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent);}
.cal-tab.active.c1{background:var(--teal-bg);border-color:var(--teal-border);color:var(--teal);}
.cal-tab.active.c2{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue);}
.cal-tab.active.c3{background:var(--rose-bg);border-color:var(--rose-border);color:var(--rose);}
.cal-tab.active.c4{background:var(--green-bg);border-color:var(--green-border);color:var(--green);}
.cal-tab.active.c5{background:var(--purple-bg);border-color:var(--purple-border);color:var(--purple);}

/* PLAN TABS */
.plan-tabs{display:flex;gap:6px;margin-bottom:10px;}
.plan-tab{flex:1;padding:10px 4px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--muted);font-size:0.72rem;font-weight:700;cursor:pointer;text-align:center;line-height:1.3;}
.plan-tab.active.p1{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent);}
.plan-tab.active.p2{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue);}
.plan-tab.active.p3{background:var(--purple-bg);border-color:var(--purple-border);color:var(--purple);}

.stat-row{display:flex;gap:6px;margin-bottom:10px;}
.stat-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;}
.stat-label{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}
.stat-value{font-size:0.9rem;font-weight:800;margin-top:2px;}
.stat-value.pos{color:var(--green);}
.stat-value.neg{color:var(--red);}
.stat-value.acc{color:var(--accent);}

.bank-bar{border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);}
.bank-bar.p1{background:var(--accent-bg);border-color:var(--accent-border);}
.bank-bar.p2{background:var(--blue-bg);border-color:var(--blue-border);}
.bank-bar.p3{background:var(--purple-bg);border-color:var(--purple-border);}
.bank-left .bl-label{font-size:0.6rem;color:var(--muted);text-transform:uppercase;}
.bank-left .bl-amount{font-size:1.3rem;font-weight:800;margin-top:2px;color:var(--green);}
.bank-left .bl-amount.zero{color:var(--red);}
.bank-left .bl-next{font-size:0.65rem;color:var(--muted);margin-top:2px;}
.bank-left .bl-next span{font-weight:700;color:var(--text);}
.bank-right{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.bank-right input{background:white;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:0.82rem;color:var(--text);font-weight:700;width:110px;text-align:right;}
.bank-right button{background:var(--accent);color:white;border:none;border-radius:6px;padding:5px 10px;font-size:0.75rem;font-weight:700;cursor:pointer;width:110px;}
.bank-right .reset-small{background:transparent;border:1px solid var(--red-border);color:var(--red);border-radius:6px;padding:4px 10px;font-size:0.7rem;font-weight:700;cursor:pointer;width:110px;}

.calendar-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
.dow{text-align:center;font-size:0.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.day{aspect-ratio:1;border-radius:8px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;padding:4px;cursor:pointer;overflow:hidden;}
.day.empty{background:transparent;border:none;cursor:default;}
.day.win{background:var(--green-bg);border-color:var(--green-border);}
.day.loss{background:var(--red-bg);border-color:var(--red-border);}
.day.pending{background:var(--accent-bg);border-color:var(--accent-border);}
.dnum{font-size:0.65rem;font-weight:700;color:var(--muted);}
.day.win .dnum{color:var(--green);}
.day.loss .dnum{color:var(--red);}
.day.pending .dnum{color:var(--accent);}
.dpl{margin-top:auto;font-size:0.52rem;font-weight:800;line-height:1.1;}
.day.win .dpl{color:var(--green);}
.day.loss .dpl{color:var(--red);}
.day.pending .dpl{color:var(--accent);}
.dstake{font-size:0.48rem;color:var(--muted);margin-top:1px;}

.summary-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;}
.section-title{font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.sum-item{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center;}
.s-label{font-size:0.55rem;color:var(--muted);text-transform:uppercase;}
.s-val{font-size:0.9rem;font-weight:800;margin-top:2px;}
.s-val.green{color:var(--green);}
.s-val.red{color:var(--red);}
.s-val.gold{color:var(--accent);}
.win-bar-wrap{background:var(--red-bg);border-radius:6px;height:8px;overflow:hidden;}
.win-bar{height:100%;background:var(--green-border);border-radius:6px;width:0%;transition:width 0.4s;}
.win-bar-label{display:flex;justify-content:space-between;font-size:0.6rem;color:var(--muted);margin-top:3px;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.overlay.open{display:flex;}
.modal{background:var(--panel);border-top:2px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:18px;padding-bottom:80px;max-height:88vh;overflow-y:auto;}
.modal-date{font-size:0.9rem;font-weight:700;margin-bottom:4px;}
.modal-cal-tag{font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-block;margin-bottom:10px;}
.modal-plans-note{font-size:0.68rem;color:var(--muted);margin-bottom:12px;background:var(--card);border-radius:8px;padding:6px 10px;}
.m-field{margin-bottom:10px;}
.m-field label{display:block;font-size:0.65rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;}
.m-field input,.m-field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font-size:0.9rem;font-family:inherit;}
.m-field textarea{resize:vertical;min-height:44px;}
.result-toggle{display:flex;gap:6px;margin-bottom:8px;}
.result-toggle button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:0.8rem;font-weight:700;cursor:pointer;}
.result-toggle button.active.win{background:var(--green-bg);border-color:var(--green-border);color:var(--green);}
.result-toggle button.active.loss{background:var(--red-bg);border-color:var(--red-border);color:var(--red);}
.result-toggle button.active.pending{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent);}
.auto-profit{font-size:0.72rem;color:var(--muted);margin:-3px 0 8px;}
.auto-profit span{font-weight:700;color:var(--text);}
.modal-actions{display:flex;gap:6px;margin-top:8px;}
.modal-actions button{flex:1;padding:11px;border-radius:9px;border:none;font-size:0.85rem;font-weight:700;cursor:pointer;}
.mbtn-save{background:var(--accent);color:white;}
.mbtn-delete{background:transparent;border:1px solid var(--red-border)!important;color:var(--red);}
.mbtn-close{background:transparent;border:1px solid var(--line)!important;color:var(--muted);}
</style>
</head>
<body>
<div class="page">

  <div class="app-header">
    <div>
      <div class="app-title">&#128197; Betting Calendar</div>
      <div class="app-sub">Track &middot; Analyse &middot; Improve</div>
    </div>
    <div class="month-nav">
      <button class="nav-btn" id="prevBtn">&#8249;</button>
      <div class="month-label" id="monthLabel"></div>
      <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
  </div>

  <!-- BACKUP / EXPORT / RESTORE -->
  <div class="action-bar">
    <button class="action-btn backup" onclick="backupData()">&#128190; Backup</button>
    <button class="action-btn export" onclick="exportMonth()">&#128196; Export</button>
    <button class="action-btn restore" onclick="document.getElementById('restoreFile').click()">&#128257; Restore</button>
    <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreData(this)">
  </div>

  <!-- CALENDAR TABS -->
  <div class="cal-tabs" id="calTabs"></div>

  <!-- PLAN TABS -->
  <div class="plan-tabs">
    <button class="plan-tab active p1" onclick="switchPlan(1)">Plan 1<br>Flat 5K</button>
    <button class="plan-tab p2" onclick="switchPlan(2)">Plan 2<br>Martingale x2</button>
    <button class="plan-tab p3" onclick="switchPlan(3)">Plan 3<br>Martingale x3</button>
  </div>

  <div class="stat-row">
    <div class="stat-card"><div class="stat-label">Bets</div><div class="stat-value acc" id="sTotalBets">0</div></div>
    <div class="stat-card"><div class="stat-label">Staked</div><div class="stat-value" id="sTotalStake">0</div></div>
    <div class="stat-card"><div class="stat-label">Net P/L</div><div class="stat-value" id="sNetPL">+0</div></div>
    <div class="stat-card"><div class="stat-label">Win %</div><div class="stat-value acc" id="sWinRate">0%</div></div>
  </div>

  <div class="bank-bar p1" id="bankBar">
    <div class="bank-left">
      <div class="bl-label">Bankroll</div>
      <div class="bl-amount" id="blAmount">Not set</div>
      <div class="bl-next" id="blMeta"></div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);">
        <div class="bl-label">Next Bet Stake</div>
        <div id="nsAmount" style="font-size:1.4rem;font-weight:800;margin-top:2px;color:var(--accent);">5,000</div>
        <div id="nsStreak" style="font-size:0.65rem;color:var(--muted);margin-top:2px;">Fixed flat stake every bet</div>
      </div>
    </div>
    <div class="bank-right">
      <input type="number" id="bankInput" placeholder="e.g. 500000" step="0.01">
      <button onclick="setBankroll()">Set Bankroll</button>
      <button class="reset-small" onclick="resetBankroll()">&#128473; Reset</button>
    </div>
  </div>

  <div class="calendar-card">
    <div class="dow-row" id="dowRow"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="summary-card">
    <div class="section-title" id="summaryTitle">Summary</div>
    <div class="summary-grid">
      <div class="sum-item"><div class="s-label">Won</div><div class="s-val green" id="mWon">0</div></div>
      <div class="sum-item"><div class="s-label">Lost</div><div class="s-val red" id="mLost">0</div></div>
      <div class="sum-item"><div class="s-label">Pending</div><div class="s-val gold" id="mPending">0</div></div>
      <div class="sum-item"><div class="s-label">Profit</div><div class="s-val green" id="mProfit">+0</div></div>
      <div class="sum-item"><div class="s-label">Losses</div><div class="s-val red" id="mLoss">0</div></div>
      <div class="sum-item"><div class="s-label">Net</div><div class="s-val" id="mNet">0</div></div>
    </div>
    <div class="win-bar-wrap"><div class="win-bar" id="winBar"></div></div>
    <div class="win-bar-label"><span id="wbLoss">Lost 0%</span><span id="wbWin">Won 0%</span></div>
  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-cal-tag" id="modalCalTag"></div>
    <div class="modal-plans-note">&#9432; One input — all 3 plans calculate automatically</div>
    <div class="m-field"><label>Odds</label><input type="number" id="oddsInput" step="0.01" placeholder="e.g. 1.85"></div>
    <div class="result-toggle" id="resultToggle">
      <button data-result="win">Win</button>
      <button data-result="loss">Loss</button>
      <button data-result="pending">Pending</button>
    </div>
    <div class="auto-profit" id="autoProfit"></div>
    <div class="m-field"><label>Notes</label><textarea id="notesInput" placeholder="Match, market, etc."></textarea></div>
    <div class="modal-actions">
      <button class="mbtn-save" id="saveBtn" style="flex:2;font-size:1rem;padding:14px;">&#128190; Save Bet</button>
    </div>
    <div class="modal-actions" style="margin-top:6px;">
      <button class="mbtn-delete" id="deleteBtn">&#128465; Delete</button>
      <button class="mbtn-close" id="closeBtn">Close</button>
    </div>
  </div>
</div>

<script>
var BASE_STAKE = 5000;

var CAL_NAMES  = ['Safe Slip V1','Safe Slip V2','Full Time V1','Full Time V2','Over 1.5 V1','Over 1.5 V2'];
var CAL_EMOJI  = ['&#128737;','&#128737;','&#127942;','&#127942;','&#9917;','&#9917;'];
var CAL_COLORS = [
  {bg:'var(--accent-bg)', border:'var(--accent-border)', color:'var(--accent)'},
  {bg:'var(--teal-bg)',   border:'var(--teal-border)',   color:'var(--teal)'},
  {bg:'var(--blue-bg)',   border:'var(--blue-border)',   color:'var(--blue)'},
  {bg:'var(--rose-bg)',   border:'var(--rose-border)',   color:'var(--rose)'},
  {bg:'var(--green-bg)',  border:'var(--green-border)',  color:'var(--green)'},
  {bg:'var(--purple-bg)', border:'var(--purple-border)', color:'var(--purple)'}
];

var currentDate    = new Date();
var currentCal     = 0;
var currentPlan    = 1;
var selectedKey    = null;
var selectedResult = 'pending';

// Build cal tabs
var calTabsEl = document.getElementById('calTabs');
CAL_NAMES.forEach(function(name,i){
  var btn = document.createElement('button');
  btn.className = 'cal-tab'+(i===0?' active c0':'');
  btn.innerHTML = CAL_EMOJI[i]+'<br>'+name;
  btn.onclick = (function(idx){ return function(){ switchCal(idx); }; })(i);
  calTabsEl.appendChild(btn);
});

// Build DOW headers
var dowRow = document.getElementById('dowRow');
['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){
  var el=document.createElement('div'); el.className='dow'; el.textContent=d; dowRow.appendChild(el);
});

// ── STORAGE ──
function pad(n){return n.toString().padStart(2,'0');}
function keyFor(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
function betKey(c,dk){return 'bets6_c'+c+':'+dk;}
function bankKey(c,p){return 'bank6_c'+c+'_p'+p;}
function startKey(c,p){return 'start6_c'+c+'_p'+p;}
function loadEntry(c,dk){var r=localStorage.getItem(betKey(c,dk));return r?JSON.parse(r):null;}
function saveEntry(c,dk,data){localStorage.setItem(betKey(c,dk),JSON.stringify(data));}
function deleteEntry(c,dk){localStorage.removeItem(betKey(c,dk));}
function getBankroll(c,p){var r=localStorage.getItem(bankKey(c,p));return r!==null?parseFloat(r):null;}
function getStart(c,p){var r=localStorage.getItem(startKey(c,p));return r!==null?parseFloat(r):null;}
function storeBankroll(c,p,v){localStorage.setItem(bankKey(c,p),parseFloat(v).toFixed(2));}
function storeStart(c,p,v){localStorage.setItem(startKey(c,p),parseFloat(v).toFixed(2));}
function fmt(n){return parseFloat(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}

// ── STAKING ──
function getCurrentStake(cal,plan,upToKey){
  var stake=BASE_STAKE, keys=[];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf('bets6_c'+cal+':')===0) keys.push(k.replace('bets6_c'+cal+':',''));
  }
  keys.sort();
  for(var j=0;j<keys.length;j++){
    var dk=keys[j];
    if(upToKey&&dk>=upToKey) break;
    var e=loadEntry(cal,dk);
    if(!e) continue;
    if(e.result==='win'||e.result==='pending'){ stake=BASE_STAKE; }
    else if(e.result==='loss'){
      if(plan===1) stake=BASE_STAKE;
      else if(plan===2) stake=stake*2;
      else if(plan===3) stake=stake*3;
    }
  }
  return stake;
}
function getNextStake(c,p){return getCurrentStake(c,p,null);}
function computeProfit(odds,stake,result){
  odds=parseFloat(odds);stake=parseFloat(stake);
  if(result==='win') return parseFloat(((odds*stake)-stake).toFixed(2));
  if(result==='loss') return -parseFloat(stake.toFixed(2));
  return 0;
}

// ── BANKROLL ──
function setBankroll(){
  var val=parseFloat(document.getElementById('bankInput').value);
  if(isNaN(val)||val<0){alert('Enter a valid amount.');return;}
  storeBankroll(currentCal,currentPlan,val);
  storeStart(currentCal,currentPlan,val);
  document.getElementById('bankInput').value='';
  refreshBankrollDisplay();
}
function resetBankroll(){
  var start=getStart(currentCal,currentPlan);
  if(start===null){alert('No starting bankroll set.');return;}
  storeBankroll(currentCal,currentPlan,start);
  refreshBankrollDisplay();
}
function recomputeBankroll(cal,plan){
  var start=getStart(cal,plan);
  if(start===null) return;
  var running=start, keys=[];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf('bets6_c'+cal+':')===0) keys.push(k.replace('bets6_c'+cal+':',''));
  }
  keys.sort();
  var stake=BASE_STAKE;
  for(var j=0;j<keys.length;j++){
    var e=loadEntry(cal,keys[j]);
    if(!e||e.result==='pending') continue;
    running+=computeProfit(e.odds,stake,e.result);
    if(running<0) running=0;
    if(e.result==='win') stake=BASE_STAKE;
    else if(e.result==='loss'){
      if(plan===1) stake=BASE_STAKE;
      else if(plan===2) stake=stake*2;
      else if(plan===3) stake=stake*3;
    }
  }
  storeBankroll(cal,plan,running);
}

function refreshBankrollDisplay(){
  var c=currentCal,p=currentPlan;
  var current=getBankroll(c,p),start=getStart(c,p);
  document.getElementById('bankBar').className='bank-bar p'+p;
  var amtEl=document.getElementById('blAmount');
  if(current===null){amtEl.textContent='Not set';amtEl.className='bl-amount';}
  else if(current<=0){amtEl.textContent='0.00 — Add more!';amtEl.className='bl-amount zero';}
  else{amtEl.textContent=fmt(current);amtEl.className='bl-amount';}
  var metaEl=document.getElementById('blMeta');
  if(start!==null&&current!==null){
    var diff=current-start;
    metaEl.innerHTML='Started: <span>'+fmt(start)+'</span> | P/L: <span>'+(diff>=0?'+':'')+fmt(diff)+'</span>';
  } else { metaEl.innerHTML=''; }
  var ns=getNextStake(c,p);
  var nsEl=document.getElementById('nsAmount');
  nsEl.style.color=p===1?'var(--accent)':p===2?'var(--blue)':'var(--purple)';
  nsEl.textContent=fmt(ns);
  var ssEl=document.getElementById('nsStreak');
  if(p===1){ ssEl.textContent='Fixed flat stake every bet'; }
  else{ ssEl.textContent=ns===BASE_STAKE?'Base stake — no active loss streak':'Loss streak active ('+(p===2?'x2':'x3')+' Martingale)'; }
}

// ── SWITCHES ──
function switchCal(c){
  currentCal=c;
  var tabs=document.querySelectorAll('.cal-tab');
  tabs.forEach(function(t,i){ t.className='cal-tab'+(i===c?' active c'+i:''); });
  refreshBankrollDisplay(); render();
}
function switchPlan(p){
  currentPlan=p;
  var tabs=document.querySelectorAll('.plan-tab');
  tabs[0].className='plan-tab'+(p===1?' active p1':'');
  tabs[1].className='plan-tab'+(p===2?' active p2':'');
  tabs[2].className='plan-tab'+(p===3?' active p3':'');
  refreshBankrollDisplay(); render();
}

// ── RENDER ──
function render(){
  var y=currentDate.getFullYear(),m=currentDate.getMonth(),c=currentCal,p=currentPlan;
  var monthName=currentDate.toLocaleString('default',{month:'long',year:'numeric'});
  document.getElementById('monthLabel').textContent=monthName;
  var planNames=['','Flat 5K','Martingale x2','Martingale x3'];
  document.getElementById('summaryTitle').textContent=CAL_NAMES[c]+' — Plan '+p+' ('+planNames[p]+') — '+monthName;
  var calGrid=document.getElementById('calGrid');
  calGrid.innerHTML='';
  var firstDay=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate();
  var won=0,lost=0,pending=0,totalProfit=0,totalLoss=0,totalStaked=0;
  for(var i=0;i<firstDay;i++){var e=document.createElement('div');e.className='day empty';calGrid.appendChild(e);}
  for(var d=1;d<=daysInMonth;d++){
    var key=keyFor(y,m,d),cell=document.createElement('div');
    cell.className='day';
    var numEl=document.createElement('div');numEl.className='dnum';numEl.textContent=d;cell.appendChild(numEl);
    var plEl=document.createElement('div');plEl.className='dpl';
    var stEl=document.createElement('div');stEl.className='dstake';
    var entry=loadEntry(c,key);
    if(entry){
      var planStake=getCurrentStake(c,p,key);
      var profit=computeProfit(entry.odds,planStake,entry.result);
      cell.classList.add(entry.result);
      if(entry.result==='pending'){plEl.textContent='Pending';stEl.textContent=fmt(planStake);}
      else{plEl.textContent=(profit>=0?'+':'')+profit.toFixed(0);stEl.textContent='Stk:'+planStake.toLocaleString();}
      totalStaked+=planStake;
      if(entry.result==='win'){won++;totalProfit+=profit;}
      else if(entry.result==='loss'){lost++;totalLoss+=profit;}
      else{pending++;}
    }
    cell.appendChild(plEl);cell.appendChild(stEl);
    (function(k,ent){cell.addEventListener('click',function(){openModal(k,ent);});})(key,entry);
    calGrid.appendChild(cell);
  }
  var totalBets=won+lost+pending,netPL=totalProfit+totalLoss,winRate=(won+lost)>0?Math.round((won/(won+lost))*100):0;
  document.getElementById('sTotalBets').textContent=totalBets;
  document.getElementById('sTotalStake').textContent=totalStaked.toLocaleString();
  var netEl=document.getElementById('sNetPL');
  netEl.textContent=(netPL>=0?'+':'')+netPL.toFixed(0);
  netEl.className='stat-value '+(netPL>0?'pos':netPL<0?'neg':'');
  document.getElementById('sWinRate').textContent=winRate+'%';
  document.getElementById('mWon').textContent=won;
  document.getElementById('mLost').textContent=lost;
  document.getElementById('mPending').textContent=pending;
  document.getElementById('mProfit').textContent='+'+totalProfit.toFixed(0);
  document.getElementById('mLoss').textContent=totalLoss.toFixed(0);
  var mNetEl=document.getElementById('mNet');
  mNetEl.textContent=(netPL>=0?'+':'')+netPL.toFixed(0);
  mNetEl.className='s-val '+(netPL>0?'green':netPL<0?'red':'');
  document.getElementById('winBar').style.width=winRate+'%';
  document.getElementById('wbWin').textContent='Won '+winRate+'%';
  document.getElementById('wbLoss').textContent='Lost '+(100-winRate)+'%';
}

// ── MODAL ──
function updateAutoProfit(){
  var odds=parseFloat(document.getElementById('oddsInput').value);
  if(isNaN(odds)||selectedResult==='pending'){document.getElementById('autoProfit').textContent='';return;}
  var ns=getNextStake(currentCal,currentPlan);
  var profit=computeProfit(odds,ns,selectedResult);
  document.getElementById('autoProfit').innerHTML='Stake: <span>'+fmt(ns)+'</span> &nbsp;|&nbsp; P/L: <span>'+(profit>=0?'+':'')+profit.toFixed(2)+'</span>';
}
function setResult(result){
  selectedResult=result;
  var btns=document.getElementById('resultToggle').getElementsByTagName('button');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.remove('active','win','loss','pending');
    if(btns[i].getAttribute('data-result')===result) btns[i].classList.add('active',result);
  }
  updateAutoProfit();
}
document.getElementById('resultToggle').addEventListener('click',function(e){
  var btn=e.target.closest('button');if(btn) setResult(btn.getAttribute('data-result'));
});
document.getElementById('oddsInput').addEventListener('input',updateAutoProfit);

function openModal(key,entry){
  selectedKey=key;
  var parts=key.split('-');
  document.getElementById('modalDate').textContent=new Date(parts[0],parts[1]-1,parts[2]).toLocaleDateString('default',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  var tag=document.getElementById('modalCalTag');
  var cc=CAL_COLORS[currentCal];
  tag.innerHTML=CAL_EMOJI[currentCal]+' '+CAL_NAMES[currentCal];
  tag.style.background=cc.bg;tag.style.border='1px solid '+cc.border;tag.style.color=cc.color;
  document.getElementById('oddsInput').value=entry?entry.odds:'';
  document.getElementById('notesInput').value=entry?(entry.notes||''):'';
  setResult(entry?entry.result:'pending');
  document.getElementById('overlay').classList.add('open');
}
document.getElementById('closeBtn').addEventListener('click',function(){document.getElementById('overlay').classList.remove('open');});
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});

document.getElementById('saveBtn').addEventListener('click',function(){
  var odds=parseFloat(document.getElementById('oddsInput').value)||0;
  saveEntry(currentCal,selectedKey,{odds:odds,result:selectedResult,notes:document.getElementById('notesInput').value});
  recomputeBankroll(currentCal,1);recomputeBankroll(currentCal,2);recomputeBankroll(currentCal,3);
  document.getElementById('overlay').classList.remove('open');
  refreshBankrollDisplay();render();
});
document.getElementById('deleteBtn').addEventListener('click',function(){
  deleteEntry(currentCal,selectedKey);
  recomputeBankroll(currentCal,1);recomputeBankroll(currentCal,2);recomputeBankroll(currentCal,3);
  document.getElementById('overlay').classList.remove('open');
  refreshBankrollDisplay();render();
});
document.getElementById('prevBtn').addEventListener('click',function(){currentDate.setMonth(currentDate.getMonth()-1);render();});
document.getElementById('nextBtn').addEventListener('click',function(){currentDate.setMonth(currentDate.getMonth()+1);render();});

// ── BACKUP / EXPORT / RESTORE ──
function backupData(){
  var data={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&(k.indexOf('bets6_')===0||k.indexOf('bank6_')===0||k.indexOf('start6_')===0)){
      data[k]=localStorage.getItem(k);
    }
  }
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='betting-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
}

function exportMonth(){
  var y=currentDate.getFullYear(),m=currentDate.getMonth(),c=currentCal,p=currentPlan;
  var monthName=currentDate.toLocaleString('default',{month:'long',year:'numeric'});
  var planNames=['','Flat 5K','Martingale x2','Martingale x3'];
  var lines=['=== '+CAL_NAMES[c]+' | Plan '+p+' ('+planNames[p]+') | '+monthName+' ===',''];
  var daysInMonth=new Date(y,m+1,0).getDate();
  var won=0,lost=0,pending=0,totalProfit=0,totalLoss=0;
  for(var d=1;d<=daysInMonth;d++){
    var key=keyFor(y,m,d);
    var entry=loadEntry(c,key);
    if(entry){
      var stake=getCurrentStake(c,p,key);
      var profit=computeProfit(entry.odds,stake,entry.result);
      var resultIcon=entry.result==='win'?'✅':entry.result==='loss'?'❌':'⏳';
      lines.push(key+' '+resultIcon+' Odds:'+entry.odds+' Stake:'+stake.toLocaleString()+' P/L:'+(profit>=0?'+':'')+profit.toFixed(0)+(entry.notes?' | '+entry.notes:''));
      if(entry.result==='win'){won++;totalProfit+=profit;}
      else if(entry.result==='loss'){lost++;totalLoss+=profit;}
      else{pending++;}
    }
  }
  var net=totalProfit+totalLoss;
  lines.push('');
  lines.push('--- Summary ---');
  lines.push('Won: '+won+' | Lost: '+lost+' | Pending: '+pending);
  lines.push('Profit: +'+totalProfit.toFixed(0)+' | Losses: '+totalLoss.toFixed(0)+' | Net: '+(net>=0?'+':'')+net.toFixed(0));
  lines.push('Win Rate: '+((won+lost)>0?Math.round(won/(won+lost)*100):0)+'%');
  var blob=new Blob([lines.join('\n')],{type:'text/plain'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=CAL_NAMES[c].replace(/ /g,'-')+'-Plan'+p+'-'+monthName.replace(/ /g,'-')+'.txt';
  a.click();URL.revokeObjectURL(url);
}

function restoreData(input){
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      var count=0;
      Object.keys(data).forEach(function(k){
        if(k.indexOf('bets6_')===0||k.indexOf('bank6_')===0||k.indexOf('start6_')===0){
          localStorage.setItem(k,data[k]);count++;
        }
      });
      alert('Restored '+count+' records successfully!');
      refreshBankrollDisplay();render();
    }catch(err){alert('Invalid backup file.');}
  };
  reader.readAsText(file);
  input.value='';
}

refreshBankrollDisplay();
render();
</script>
